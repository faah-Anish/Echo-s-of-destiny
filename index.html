<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Destiny - By Anish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(180deg, #090a10 0%, #121526 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .manga-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 1.5px;
        }

        /* Authentic Manga Comic Banner Text Styling */
        .manga-comic-text {
            font-family: 'Bangers', cursive;
            color: #ffee00;
            text-shadow: 2px 2px 0px #000000, 
                         -2px -2px 0px #000000, 
                         2px -2px 0px #000000, 
                         -2px 2px 0px #000000,
                         0px 3px 6px rgba(0,0,0,0.9);
            letter-spacing: 2.5px;
        }

        /* Character Cutout Display */
        .character-img {
            height: 100%;
            width: 100%;
            object-fit: fill;
            object-position: bottom;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.9));
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .character-box {
            filter: grayscale(60%) opacity(0.4);
            transition: all 0.3s ease;
        }

        .character-box.active {
            filter: grayscale(0%) opacity(1);
        }

        .character-box.active .character-img {
            transform: scale(1.02);
        }

        /* Speech Bubble */
        .manga-bubble {
            background: #ffffff;
            color: #000000;
            border: 4px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            border-radius: 16px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.25;
            position: relative;
            text-transform: uppercase;
            text-align: center;
            min-height: 70px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .manga-bubble::before {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 10px 0 10px;
            border-style: solid;
            border-color: #000000 transparent transparent transparent;
        }

        .manga-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 7px 0 7px;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        .typewriter-cursor::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: #ff0055;
            font-weight: 900;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Floating PNG Particles Animation */
        .floating-png {
            position: absolute;
            width: 36px;
            height: 36px;
            object-fit: contain;
            animation: floatUp 3.5s infinite ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(40px) scale(0.5) rotate(-15deg); opacity: 0; }
            40% { opacity: 0.95; }
            100% { transform: translateY(-160px) scale(1.1) rotate(15deg); opacity: 0; }
        }

        /* Action Buttons */
        .btn-manga-action {
            font-family: 'Bangers', cursive;
            background: #ff0055;
            color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #ffffff;
            letter-spacing: 2px;
            transition: all 0.15s ease;
        }

        .btn-manga-action:hover {
            background: #e6004c;
            transform: translate(-2px, -2px);
        }

        .btn-manga-action:active {
            transform: translate(2px, 2px);
        }

        .btn-choice-yes {
            font-family: 'Bangers', cursive;
            background: #22c55e;
            color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #ffffff;
        }

        .btn-choice-no {
            font-family: 'Bangers', cursive;
            background: #ef4444;
            color: #ffffff;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #ffffff;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 relative">

    <video id="sceneVideo" class="hidden" playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- HEADER WITH CHAPTER 1, MANGA TYPOGRAPHY & FICTION DISCLAIMER -->
    <header class="w-full max-w-lg mt-1 z-20">
        <div class="bg-black/85 border-3 border-white p-2.5 rounded-xl flex flex-col px-4 shadow-[4px_4px_0px_#ff0055] text-center">
            <div class="flex items-center justify-between w-full">
                <h1 class="manga-comic-text text-xl tracking-wider">
                    CHAPTER 1: ECHOES OF DESTINY
                </h1>
                <span class="manga-font text-sm text-pink-400 tracking-widest uppercase drop-shadow-[1px_1px_0px_#000]">
                    BY ANISH
                </span>
            </div>
            <p class="text-[10px] text-gray-300 font-sans tracking-wide mt-1">
                All characters and events depicted are entirely fictional.
            </p>
        </div>
    </header>

    <!-- Start Overlay Screen -->
    <div id="startOverlay" class="absolute inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="manga-font text-6xl text-pink-500 mb-2 drop-shadow-[3px_3px_0px_#fff]">
            ECHOES OF DESTINY
        </h1>
        <p class="text-gray-400 text-xs mb-6 tracking-widest uppercase">Chapter 1 - Interactive Comic Experience by Anish</p>
        <button id="startBtn" class="btn-manga-action text-2xl px-8 py-3 rounded-xl uppercase">
            ⚡ START SCENE
        </button>
    </div>

    <!-- Step 1: Choice Overlay Screen (YES / NO) -->
    <div id="choiceOverlay" class="absolute inset-0 bg-black/85 z-40 flex flex-col items-center justify-center p-6 text-center hidden">
        <h2 class="manga-font text-3xl text-yellow-400 mb-6 tracking-wider">
            IS IT?
        </h2>
        <div class="flex gap-6 w-full max-w-xs">
            <button id="yesBtn" class="btn-choice-yes flex-1 py-3 text-3xl rounded-xl uppercase">
                YES
            </button>
            <button id="noBtn" class="btn-choice-no flex-1 py-3 text-3xl rounded-xl uppercase">
                NO
            </button>
        </div>
    </div>

    <!-- Step 2: Anonymous Comment Modal Overlay -->
    <div id="commentOverlay" class="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="bg-slate-900 border-4 border-black p-6 rounded-2xl w-full max-w-xs shadow-[6px_6px_0px_#ff0055]">
            <h3 class="manga-font text-2xl text-yellow-400 mb-2 tracking-wider">
                LEAVE A COMMENT
            </h3>
            <p class="text-xs text-gray-300 mb-4 font-sans">
                Type an anonymous message or feedback below:
            </p>
            <textarea id="commentInput" rows="3" placeholder="Write your anonymous comment here..." class="w-full bg-slate-800 text-white p-3 rounded-xl border-2 border-slate-600 focus:border-pink-500 focus:outline-none text-sm mb-4 resize-none"></textarea>
            
            <button id="submitCommentBtn" class="btn-manga-action w-full py-3 text-xl rounded-xl uppercase">
                🚀 SEND MESSAGE
            </button>
        </div>
    </div>

    <!-- MAIN MANGA DISPLAY AREA -->
    <div class="w-full max-w-lg flex-1 flex flex-col justify-end relative z-10 mb-14 px-1">
        
        <!-- MAX FLOATING STICKERS CONTAINER (15 PARTICLES) -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <img src="heart1.png" alt="Particle 1" class="floating-png left-[5%]" style="animation-delay: 0s;">
            <img src="heart2.png" alt="Particle 2" class="floating-png left-[12%]" style="animation-delay: 0.8s;">
            <img src="heart3.png" alt="Particle 3" class="floating-png left-[20%]" style="animation-delay: 1.6s;">
            <img src="heart4.png" alt="Particle 4" class="floating-png left-[28%]" style="animation-delay: 2.3s;">
            <img src="heart5.png" alt="Particle 5" class="floating-png left-[35%]" style="animation-delay: 0.4s;">
            
            <img src="heart1.png" alt="Particle 6" class="floating-png left-[42%]" style="animation-delay: 1.2s;">
            <img src="heart2.png" alt="Particle 7" class="floating-png left-[50%]" style="animation-delay: 2.0s;">
            <img src="heart3.png" alt="Particle 8" class="floating-png left-[58%]" style="animation-delay: 0.2s;">
            <img src="heart4.png" alt="Particle 9" class="floating-png left-[65%]" style="animation-delay: 1.8s;">
            <img src="heart5.png" alt="Particle 10" class="floating-png left-[72%]" style="animation-delay: 2.7s;">
            
            <img src="heart1.png" alt="Particle 11" class="floating-png left-[78%]" style="animation-delay: 0.6s;">
            <img src="heart2.png" alt="Particle 12" class="floating-png left-[85%]" style="animation-delay: 1.4s;">
            <img src="heart3.png" alt="Particle 13" class="floating-png left-[92%]" style="animation-delay: 2.2s;">
            <img src="heart4.png" alt="Particle 14" class="floating-png left-[48%]" style="animation-delay: 3.1s;">
            <img src="heart5.png" alt="Particle 15" class="floating-png left-[22%]" style="animation-delay: 2.9s;">
        </div>

        <!-- CHARACTER DISPLAY AREA -->
        <div class="flex items-end justify-between gap-2 z-10 w-full h-[85%]">

            <!-- MAN CHARACTER (LEFT) -->
            <div id="manContainer" class="character-box flex-1 h-full flex flex-col items-center justify-end max-w-[220px]">
                <div id="manBubble" class="manga-bubble">
                    <span id="manText" class="typewriter-cursor">...</span>
                </div>
                <div class="w-full h-[280px] sm:h-[360px] flex items-end justify-center overflow-hidden">
                    <img src="man.png" alt="Man Cutout" class="character-img">
                </div>
            </div>

            <!-- LADY CHARACTER (RIGHT) -->
            <div id="ladyContainer" class="character-box flex-1 h-full flex flex-col items-center justify-end max-w-[220px]">
                <div id="ladyBubble" class="manga-bubble">
                    <span id="ladyText" class="typewriter-cursor">...</span>
                </div>
                <div class="w-full h-[280px] sm:h-[360px] flex items-end justify-center overflow-hidden">
                    <img src="lady.png" alt="Lady Cutout" class="character-img">
                </div>
            </div>

        </div>
    </div>

    <!-- SAY LINE BUTTON -->
    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-30">
        <button id="sayBtn" class="btn-manga-action hidden px-8 py-3 text-2xl rounded-2xl uppercase animate-bounce whitespace-nowrap">
            💬 SAY LINE
        </button>
    </div>

    <!-- Copyright Footer -->
    <footer class="w-full text-center py-1 z-20 bg-black/90 border-t border-white/10 fixed bottom-0 left-0 right-0">
        <p class="text-[10px] text-gray-400 tracking-wider uppercase">
            © 2026 Created by Anish
        </p>
    </footer>

    <script>
        // TELEGRAM BOT CONFIGURATION
        const TELEGRAM_BOT_TOKEN = "8547968388:AAGH-qzeILTIBIUceZmGUYmyDcC3ZkchnPg";
        const TELEGRAM_CHAT_ID = "6339129165";

        let selectedChoice = "";

        function sendTelegramResponse(userChoice, commentText) {
            if (TELEGRAM_BOT_TOKEN === "YOUR_TELEGRAM_BOT_TOKEN") return;

            const safeComment = commentText.trim() !== "" ? commentText : "No comment provided";
            const message = `📥 *New Echoes of Destiny Response*\n\n👤 *Author:* Anish\n❓ *Answer:* ${userChoice}\n💬 *Anonymous Comment:* ${safeComment}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            }).catch(err => console.log("Telegram Error:", err));
        }

        const dialogues = [
            {
                speaker: "Man",
                startTime: 0.0,
                endTime: 7.5,
                text: "Forgive me... Your beauty brings light to this place, filled with dark suits and top hats."
            },
            {
                speaker: "Woman",
                startTime: 10.0,
                endTime: 11.5,
                text: "Very true."
            },
            {
                speaker: "Man",
                startTime: 11.5,
                endTime: 16.0,
                text: "Madam, it is an honor and a pleasure to see you again."
            },
            {
                speaker: "Woman",
                startTime: 16.0,
                endTime: 18.0,
                text: "Have we met before?"
            },
            {
                speaker: "Man",
                startTime: 18.0,
                endTime: 27.0,
                text: "In a dream, perhaps. I have this strange feeling that we have known each other for a long time."
            },
            {
                speaker: "Woman",
                startTime: 27.0,
                endTime: 29.5,
                text: "That's very romantic."
            },
            {
                speaker: "Man",
                startTime: 29.5,
                endTime: 32.0,
                text: "Is it?"
            }
        ];

        let currentIndex = 0;
        let isWaitingForUser = false;
        let typingTimer = null;

        const video = document.getElementById('sceneVideo');
        const startOverlay = document.getElementById('startOverlay');
        const choiceOverlay = document.getElementById('choiceOverlay');
        const commentOverlay = document.getElementById('commentOverlay');
        const commentInput = document.getElementById('commentInput');
        const submitCommentBtn = document.getElementById('submitCommentBtn');
        const startBtn = document.getElementById('startBtn');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const manContainer = document.getElementById('manContainer');
        const ladyContainer = document.getElementById('ladyContainer');
        const manText = document.getElementById('manText');
        const ladyText = document.getElementById('ladyText');
        const sayBtn = document.getElementById('sayBtn');

        function startSyncedTyping(targetElement, fullText, durationSeconds) {
            targetElement.innerText = "";
            clearInterval(typingTimer);

            const totalChars = fullText.length;
            const delayMs = Math.max(20, (durationSeconds * 1000) / totalChars);

            let charIdx = 0;
            typingTimer = setInterval(() => {
                if (charIdx < totalChars) {
                    targetElement.innerText += fullText.charAt(charIdx);
                    charIdx++;
                } else {
                    clearInterval(typingTimer);
                }
            }, delayMs);
        }

        startBtn.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            playStep(0);
        });

        function playStep(index) {
            if (index >= dialogues.length) {
                choiceOverlay.classList.remove('hidden');
                sayBtn.classList.add('hidden');
                return;
            }

            currentIndex = index;
            const current = dialogues[index];
            const duration = current.endTime - current.startTime;

            if (current.speaker === "Man") {
                isWaitingForUser = false;
                sayBtn.classList.add('hidden');

                manContainer.classList.add('active');
                ladyContainer.classList.remove('active');

                video.currentTime = current.startTime;
                video.play();
                startSyncedTyping(manText, current.text, duration);

            } else if (current.speaker === "Woman") {
                video.pause();
                video.currentTime = current.startTime;
                isWaitingForUser = true;

                ladyContainer.classList.add('active');
                manContainer.classList.remove('active');

                ladyText.innerText = `"${current.text}"`;
                sayBtn.classList.remove('hidden');
            }
        }

        video.addEventListener('timeupdate', () => {
            if (isWaitingForUser) return;

            const current = dialogues[currentIndex];
            if (current && video.currentTime >= current.endTime) {
                playStep(currentIndex + 1);
            }
        });

        sayBtn.addEventListener('click', () => {
            if (isWaitingForUser) {
                isWaitingForUser = false;
                sayBtn.classList.add('hidden');
                
                const current = dialogues[currentIndex];
                const duration = current.endTime - current.startTime;

                video.play();
                startSyncedTyping(ladyText, current.text, duration);
            }
        });

        // YES Choice Click
        yesBtn.addEventListener('click', () => {
            selectedChoice = "YES";
            choiceOverlay.classList.add('hidden');
            commentOverlay.classList.remove('hidden');
        });

        // NO Choice Click
        noBtn.addEventListener('click', () => {
            selectedChoice = "NO";
            choiceOverlay.classList.add('hidden');
            commentOverlay.classList.remove('hidden');
        });

        // Submit Comment Click
        submitCommentBtn.addEventListener('click', () => {
            const userComment = commentInput.value;
            commentOverlay.classList.add('hidden');
            
            ladyText.innerText = selectedChoice === "YES" ? "YES, IT IS!" : "NOT AT ALL...";
            sendTelegramResponse(selectedChoice, userComment);
        });
    </script>
</body>
</html>
